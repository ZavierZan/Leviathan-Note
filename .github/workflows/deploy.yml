name: Deploy Quartz site

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Quartz v4 needs Node 22+
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Build with the Quartz CLI (no package.json scripts needed)
      - name: Build site with Quartz
        run: npx -y quartz build -d content -o public

      # Publish ./public to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
